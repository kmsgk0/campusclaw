services:
  app:
    build: .
    restart: unless-stopped
    environment:
      SEED_PASSWORD: ${SEED_PASSWORD:?Set SEED_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:?Set EMBEDDING_BASE_URL}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:?Set EMBEDDING_API_KEY}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:?Set EMBEDDING_MODEL}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-2048}
      CHAT_BASE_URL: ${CHAT_BASE_URL:?Set CHAT_BASE_URL}
      CHAT_API_KEY: ${CHAT_API_KEY:?Set CHAT_API_KEY}
      CHAT_MODEL: ${CHAT_MODEL:?Set CHAT_MODEL}
      MCP_MAX_ROUNDS: ${MCP_MAX_ROUNDS:-3}
      MCP_MAX_CALLS: ${MCP_MAX_CALLS:-24}
      QDRANT_URL: http://qdrant:6333
    depends_on:
      - qdrant
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HOST_PORT:-8080}:8080"
    volumes:
      - data:/app/data
      - uploads:/app/uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
  mcp-tools:
    build: .
    restart: unless-stopped
    command: ["gunicorn", "--chdir", "mcp-server", "--bind", "0.0.0.0:8090", "--workers", "1", "--threads", "2", "server:create_app()"]
    environment:
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:?Set MCP_AUTH_TOKEN}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
  qdrant:
    image: qdrant/qdrant:v1.19.1
    restart: unless-stopped
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
    volumes:
      - vectors:/qdrant/storage
volumes:
  vectors:
  data:
  uploads:
