schema: spec-driven

context: |
  CampusClaw provides class-isolated materials, retrieval and cited answers.
  Backend: Python, Flask, SQLite/FTS5 and Qdrant; external embedding/chat APIs.
  Frontend: React, Vite, Radix Dialog/Tabs, Lucide icons and Geist.
  Flask serves the frontend build; Docker Compose persists data, uploads and vectors.
